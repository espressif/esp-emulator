// esp-emu hardware-in-the-loop co-simulation bus.
//
// THIS FILE IS THE CONTRACT between the `esp-emu` emulator and a device model
// running outside it. It is the ONLY thing they share. The emulator knows
// nothing about devices or boards; a model knows nothing about emulator
// internals. Everything either side is allowed to assume about the other is
// written down here, so the comments are part of the contract.
//
// Two channels. Every transport must provide both.
//   PUB      Emulator -> all models. Each message is [topic][EmulatorMessage].
//            The emulator never waits. A model that stops reading misses
//            messages; the CPU does not pause for it.
//   ROUTER   Two-way, with one model at a time. Used for registration,
//            scheduled inputs (e.g. drive a pin) and answers to bus requests.
//
// A transport carries both channels and nothing else. The emulator has four:
// the browser's, where a page pumps the byte queues itself; the part host,
// which runs .wasm parts in the emulator's own process (`--cosim-board`); a
// socket of length-prefixed frames, one consumer per connection
// (`--cosim-tcp`); and an in-process loopback for tests. Several may serve
// one chip at once. A new transport changes nothing in this file.
//
// Topics are hierarchical and filtered by byte prefix on frame 0, so
// subscribing to "HW/GPIO/" receives every pin and "HW/GPIO/4/" only pin 4:
//   SIM/CLOCK             ClockSync, once per simulated quantum
//   SIM/RESET             ChipReset, once per chip reset
//   HW/GPIO/<pin>/LEVEL   one message per pin per change

syntax = "proto3";

package esp_cosim.v1;

// Protocol version, checked at handshake so a mismatch is a refused
// registration rather than a silent misparse.
//
// Deliberately a declaration rather than a comment: every generated binding
// takes its constant from here, so the two sides cannot drift apart.
//   Rust:   esp_emu::cosim::proto::ProtoVersion::Current (PROTO_VERSION)
//   JS:     pb.esp_cosim.v1.ProtoVersion.PROTO_VERSION_CURRENT
//
// Bump on ANY incompatible change: a renumbered field, a narrowed meaning, a
// new required behaviour. Adding a new optional field or a new oneof arm is
// backward compatible and does not need a bump.
enum ProtoVersion {
  PROTO_VERSION_UNSPECIFIED = 0;
  PROTO_VERSION_CURRENT = 1;
}

// How a part compiled to WebAssembly is called: the functions it exports and
// what its shared buffer holds. Written down in PART_ABI.md; the number lives
// here so the part crates and every host that loads a part read one value
// instead of restating it.
//
// Separate from ProtoVersion because the two move for different reasons: this
// changes when a required export is added, removed or narrowed, that when a
// message does.
//
// A host that does not implement the version a module reports refuses it
// rather than calling a shape it guessed.
enum PartAbiVersion {
  PART_ABI_VERSION_UNSPECIFIED = 0;
  PART_ABI_VERSION_CURRENT = 1;
}

// Every message on either channel, in both directions, is one of these.
message EmulatorMessage {
  // Absolute virtual time in NANOSECONDS since chip reset.
  //
  // This is the emulated systimer - the very same 16 MHz counter the guest
  // firmware reads through esp_timer_get_time() - so the two processes agree on
  // the timeline by construction, with no clock syncing. It is NOT host wall
  // time and has no relation to it.
  //
  //   emu -> consumer: when the reported event happened.
  //   consumer -> emu: when the requested event SHOULD happen. May be in the
  //                    past, which is legal but lossy - see ClockSync.events_fired_late.
  uint64 sim_time_ns = 1;

  // Two messages stamped with the same sim_time_ns keep their order: every
  // transport delivers in order, and the emulator applies same-time inputs in
  // the order it received them.

  oneof payload {
    // emu -> consumer, on PUB.
    ClockSync clock_sync = 2;
    GpioLevel gpio_level = 3;

    // Handshake, on ROUTER.
    Register register = 4;         // consumer -> emu
    RegisterAck register_ack = 5;  // emu -> consumer

    // consumer -> emu, on ROUTER.
    GpioDrive gpio_drive = 6;

    // A transaction the guest waits on, on ROUTER both ways. See BusRequest.
    BusRequest bus_request = 7;  // emu -> consumer
    BusReply bus_reply = 8;      // consumer -> emu

    // emu -> consumer, on PUB.
    ChipReset chip_reset = 9;
  }
}

// The chip reset. Broadcast on SIM/RESET, once per reset, to every registered
// consumer, stamped with the first instant of the new timeline.
//
// Only the CHIP reset: the board did not. A consumer's own device keeps its
// state, as a real sensor keeps its registers and a real button stays pressed
// when the MCU next to it reboots. What the consumer drives on a pin stays
// driven: the emulator re-applies every level a consumer last asked for, so
// a line held low before the reset still reads low to the firmware after it,
// and nothing has to be re-sent. What a consumer SCHEDULED is gone: a
// sim_time_ns in the queue named a time on the old timeline, and the queue is
// emptied (ClockSync does not count those as dropped). A consumer that holds
// a deadline of its own compares it against a clock that has gone backwards
// and should treat it as passed, or as void, as its device would.
//
// Carries the level of every pin as the chip drives it after the reset, in
// the encoding of RegisterAck.pin_levels: every output the firmware had set
// is released, so most pins are back to high. No GpioLevel is published for
// those changes; this message is the whole word instead.
message ChipReset {
  uint64 pin_levels = 1;
}

// Broadcast on SIM/CLOCK once per simulated quantum (default 1 ms of virtual
// time). Consumers use it to advance their own state machines.
//
// "Once per quantum" is an upper bound, not a guarantee of one per boundary.
// Emulated time does not advance smoothly: a WFI fast-forward can jump several
// milliseconds in one step, and every boundary it crossed collapses into the
// single broadcast carrying the current time. Never infer elapsed time by
// counting ClockSyncs -- read sim_time_ns.
//
// TIMING MODEL - read this before writing a consumer. The emulator is ADVISORY:
// it broadcasts and keeps running. It does NOT wait for you to reply, and a
// consumer that falls behind does not slow it down. The practical consequence
// is that an event you schedule must be far enough ahead that your message
// arrives before the virtual clock passes it. A few milliseconds is comfortable
// because the emulator paces itself against wall time; a few microseconds is
// not. When you lose that race the event still fires, just late, and
// events_fired_late below tells you it happened.
message ClockSync {
  // Cumulative count of scheduled events whose sim_time_ns had already passed
  // when the emulator dequeued them. Zero means every event you scheduled
  // landed where you asked. A test that cares about timing should assert this
  // is still zero at the end of the run.
  uint64 events_fired_late = 1;

  // Worst lateness observed so far, in nanoseconds. Pairs with the count above.
  uint64 max_lateness_ns = 2;

  // Broadcasts the emulator threw away because ITS OWN outbound queue was full
  // -- nobody was collecting them. It drops rather than blocks or grows without
  // bound, because the CPU loop must never stall on a model.
  //
  // Not a count of everything you missed: a transport may drop on its own
  // before this, and that is not visible here.
  uint64 broadcasts_dropped = 3;

  // Scheduled events the emulator refused because the event queue was full
  // -- somebody asked for too much.
  //
  // The queue is SHARED and bounded. When it is full, an incoming event is
  // refused; an event already accepted is never removed to make room. So a
  // model never loses an event it was not told about at send time, but a
  // model that schedules heavily can fill the queue and get ANOTHER model's
  // new events refused. This number is a total, not yours.
  //
  // Nonzero means somebody is scheduling deeper than this bus is built for.
  // The fix is not a bigger queue: hold your own deadline and act on it when
  // a ClockSync shows the clock has passed it.
  uint64 scheduled_dropped = 4;
}

// One pin's line level changed. Published per pin on HW/GPIO/<pin>/LEVEL.
//
// For a pin some consumer named in GpioClaim.watch_pins: one message per
// transition, in order, each stamped (sim_time_ns) with the time of the
// transition itself, so a pulse the firmware drives and releases inside one
// peripheral tick is two messages, each at its own time. The messages of one
// tick go out together at its end, so they arrive up to a tick (256 CPU
// cycles, ~1.6 us at 160 MHz) after their stamp; the stamp is within one
// system-timer step (62.5 ns) of the transition.
//
// For any other pin: the level at the end of the tick, published when it
// differs from the last. A pulse inside one tick is not seen there.
//
// `level` is the line as the CHIP drives it: the output value where the chip
// drives the pin, released-high where it does not. It deliberately does NOT
// include levels driven by a consumer. If it did, you could not distinguish
// "the chip released the line" from "the chip is driving the same value I am",
// which is the distinction an open-drain bus is built on.
message GpioLevel {
  uint32 pin = 1;
  bool level = 2;
}

// First message a consumer sends, on ROUTER. The emulator answers RegisterAck.
message Register {
  // Send ProtoVersion.PROTO_VERSION_CURRENT as generated from this file.
  uint32 proto_version = 1;
  // Free-form, for logs only. Name it after what it models ("button-gpio4").
  string name = 2;

  // What this consumer answers for. Empty is legal and means this peer only
  // watches: it receives everything it subscribes to and is never asked to
  // answer anything.
  //
  // This is how a board's wiring reaches the emulator without the emulator
  // ever reading a board file. Whatever describes the board - a studio's
  // diagram, a hand-written config - is turned into claims by whoever starts
  // the consumers. The emulator learns only the routing facts: this peer
  // drives that pin, answers for that I2C address on those pads, or is the SPI
  // device on that chip-select pad.
  //
  // Claims are exclusive and checked at handshake. Two consumers claiming the
  // same pin, the same I2C address on the same pads, or the same chip-select
  // pad, is a wiring error, not
  // a race to be resolved at runtime, so the second registration is REFUSED
  // with the conflict named in RegisterAck.reject_reason. Refusal is
  // all-or-nothing: one bad claim rejects the whole registration rather than
  // leaving a peer half-attached and wondering which of its claims took.
  repeated Claim claims = 3;
}

// How a part is wired, told to it before it registers. See PART_ABI.md.
//
// A part models a device, not a placement. A button is a button wherever it
// sits; which pins it is bolted to is a fact about the BOARD, and the board is
// described somewhere else — a studio's diagram, a test, a demo page. Baking a
// pin number into a part would mean one module per placement, not one per
// device.
//
// So the wiring arrives here, and the part's claims follow from it. Never sent
// on either channel: whatever hosts the part hands it over before the part
// builds its Register, because a part cannot say what it answers for until it
// knows where it is.
message PartConfig {
  // The part's own pin names, mapped to the chip pin each is wired to:
  // {"A": 9} for a button, {"SCL": 6, "SDA": 5} for an I2C sensor,
  // {"CS": 7, "SCK": 6, "SO": 2} for an SPI one. Names rather
  // than roles, because a part with two pins of one role has no other way to
  // tell them apart. A name missing here is a pin the board left unconnected.
  map<string, uint32> pins = 1;
  // Not used: which I2C port a part is on follows from its pads (I2cClaim).
  reserved 2;
  reserved "bus";
  // The 7-bit I2C address the board strapped the part to, for a device whose
  // address pins choose between several. Zero means the part's own default,
  // which for most devices is the only address the silicon has.
  uint32 addr = 3;
  // Not used: which SPI bus and chip-select slot a part is on follows from
  // its chip-select pad (SpiClaim).
  reserved 4;
  reserved "cs_slot";
}

// What a part shows: its own state, for a page or a script to display. See
// `part_state` in PART_ABI.md. Never sent on either channel: a host asks the
// part for it on behalf of whoever is looking, as it hands the part an
// interaction on behalf of whoever clicked.
//
// The emulator has no part in this. A pin's level is a fact about the chip
// and travels as GpioLevel; what an LED on that pin looks like, what a sensor
// is set to, what a display holds, is the part's own and travels here.
message PartState {
  // Named readings and indicators, in the part's own words: "pressed" ->
  // "true", "temperature" -> "22.5", "lit" -> "false". The names are the
  // part's, as its interactions are; a UI shows what it is given, and a
  // script reads the ones it knows. A value is the plain decimal or word the
  // part would print.
  map<string, string> values = 1;
}

// One thing a consumer answers for. See Register.claims.
message Claim {
  oneof what {
    GpioClaim gpio = 1;
    I2cClaim i2c = 2;
    SpiClaim spi = 3;
  }
}

// "I am the device at this address, on these two pads."
//
// Which I2C port the pads belong to is the firmware's choice, written into the
// GPIO matrix (or IO_MUX) by its driver after every part has attached. So a
// claim names pads, and the emulator works out the port from the routing the
// firmware wrote, again whenever it changes. Until the driver has routed the
// pads they resolve to no port, which is normal before it starts.
//
// A transaction to an address nobody claims on that port is NACKed at once,
// without asking anyone: on real hardware nothing pulls SDA low and the master
// sees a NACK within a byte time. That is also what makes a bus scan of a
// modelled board find only the board's devices.
//
// A port with a claimed device is answered by parts alone. The emulator's own
// devices -- the test EEPROM at 0x50 and any --i2c-dev register file -- are
// not asked on it. A port nobody claims keeps them.
message I2cClaim {
  // 7-bit address, unshifted: the same encoding as I2cTransaction.addr. The
  // pads are shared by every device on a bus, so they give the port and the
  // address gives the device.
  uint32 addr = 1;

  // The pads this device is wired to. BOTH are required. Either alone would
  // identify the port, but the two let the emulator check they resolve to the
  // SAME port and report a device drawn across two.
  //
  // `optional` for presence, not for style: GPIO 0 is a real pad, so a bare
  // uint32 could not tell it from a field nobody set, and a missing pad has to
  // be refused rather than read as pin 0.
  optional uint32 scl_pin = 2;
  optional uint32 sda_pin = 3;
}

// "I am the SPI device on this chip select."
//
// A chip select is one pad per device, and the one thing a drawing knows for
// certain, so it is the whole claim. Which GPSPI bus and which chip-select
// slot the pad is, is the firmware's choice, written into the GPIO matrix (or
// IO_MUX) when its driver adds the device, after every part has attached. The
// emulator works the pair out from that routing, again whenever it changes.
// Until the driver has routed the pad it resolves to nothing, which is normal
// before it starts.
//
// A transfer on a chip select nobody claims is answered at once as an
// undriven bus, without asking anyone: nothing drives MISO, so a read gets
// 0xFF. A transfer that selects no single line (none, or several) names no
// device and is answered the same way.
message SpiClaim {
  // `optional` for presence, as on I2cClaim: GPIO 0 is a real pad, and a
  // claim without a chip select is refused rather than read as pin 0.
  optional uint32 cs_pin = 1;

  // The bus pads, if the drawing knows them. Corroboration only: the chip
  // select already identifies the bus and the slot, so these are never needed
  // to route and a device that lacks one is not refused -- a MAX6675 has no
  // MOSI pin at all, and a write-only display has no MISO. What they buy is a
  // board drawn with its chip select on one bus and its clock on another being
  // told so.
  optional uint32 clk_pin = 2;
  optional uint32 mosi_pin = 3;
  optional uint32 miso_pin = 4;
  // The two extra data lines of a quad device (SIO2 = WP, SIO3 = HD), for a
  // QSPI panel or flash. Corroboration only, like the three above.
  optional uint32 wp_pin = 5;
  optional uint32 hd_pin = 6;

  // The level that selects the device: true for one selected by a high chip
  // select (a 93C46 EEPROM), absent or false for the usual active-low one.
  // Read only when the firmware drives the chip select as a plain GPIO
  // (`spics_io_num = -1`): the pad then carries no controller chip select, so
  // the emulator takes the bus from clk_pin or a data pin and routes each
  // transfer to the device whose pad is at its selecting level as the
  // transfer is clocked. A chip select the controller drives selects by its
  // slot, and this is not consulted.
  optional bool cs_active_high = 7;
}

// "I drive these pins."
//
// Bit N = GPIO N, the same encoding as RegisterAck.pin_levels. A claim makes
// the pin exclusive: once claimed, a GpioDrive on it from any other peer is
// dropped, so two models cannot fight over one line. A pin nobody claims may
// be driven by any registered peer.
//
// OBSERVING a pin at tick resolution needs no claim: every pin's level is
// published to whoever subscribes, once per peripheral tick when it differs.
// `watch_pins` asks for more: every transition of those pins, each at its own
// time, so a pulse inside one tick is two messages. Not exclusive, any pin,
// including one this consumer drives. An LED model should watch its pin and
// claim nothing else; a WS2812 or a logic view cannot do without it.
message GpioClaim {
  uint64 drive_pins = 1;
  uint64 watch_pins = 2;
}

message RegisterAck {
  uint32 proto_version = 1;
  // The emulated part, as passed to --chip: "esp32c3", "esp32p4", ...
  string chip = 2;
  // Highest usable GPIO number plus one. Pins beyond this are rejected.
  uint32 pin_count = 3;
  uint64 quantum_ns = 4;
  // False means every other field except reject_reason is unset, and the
  // emulator WILL ignore anything else this consumer sends. This is enforced,
  // not advisory: commands from a peer that never registered, or whose
  // registration was refused, are dropped. Do not proceed on a refusal.
  //
  // Causes: a proto_version mismatch, too many consumers, a claim the chip
  // cannot honour (a pin it does not have, an address above 0x7F, an SPI claim
  // with no chip select), or a claim
  // that collides with one an earlier peer already holds.
  bool accepted = 5;
  string reject_reason = 6;
  // Line level of every pin at the instant of accept, bit N = GPIO N, in the
  // same released-high encoding as GpioLevel. A consumer attaching mid-run
  // needs this: it would otherwise assume the reset state and stay wrong about
  // any pin the firmware drove during init until that pin next moved.
  uint64 pin_levels = 7;
}

// Drive an input pin, at EmulatorMessage.sim_time_ns. Sent on ROUTER.
//
// The emulator holds this in a priority queue and applies it when its virtual
// clock reaches that time, shortening the CPU batch so it lands within one
// peripheral tick rather than at the next quantum boundary. Scheduling into the
// future is the intended use; that is what makes the timing precise.
//
// If sim_time_ns has already passed when the message is dequeued, the event
// fires immediately and is counted in ClockSync.events_fired_late.
//
// A model drives a LEVEL, nothing more. Whether that becomes an interrupt is
// the chip's business: an ISR runs only if the guest configured INT_TYPE and
// INT_ENA on this pin. There is deliberately no way to inject an interrupt
// directly — every chip re-derives its interrupt lines from peripheral state
// each tick, so an injected one would be erased within 256 cycles.
message GpioDrive {
  uint32 pin = 1;
  bool level = 2;
}

// A bus transaction the guest waits on.
//
// Sent on ROUTER to the one consumer whose claim names the address or the
// chip select, and to no other: two of one device on two ports share an
// address, and each would otherwise act on the other's commands. A request is
// never sent for an address or a chip select nobody claims; the emulator
// answers those itself, as a NACK or as an undriven bus.
//
// An SPI transfer with rx_len 0 is sent too, and is the exception to what
// follows: it reads nothing, so it has already completed when it is sent and
// the guest is not waiting on it. A device that only listens -- a display, a
// DAC -- still has to see what was written. Do not answer it: an answer is
// refused like any reply to a request that is not out.
//
// The emulator withholds the peripheral's completion interrupt, so the guest
// waits exactly as it would on real hardware: in the poll loop its driver
// already has, or asleep on the semaphore it already uses. Nothing blocks
// inside the guest's store instruction.
//
// THE EMULATOR STOPS while a transaction is out. No emulated time passes
// between the request going out and the reply coming back, so the guest sees
// the same timing however long the host took to deliver the answer. Take as
// long as you need: a slow consumer costs wall time, never firmware behaviour.
// But you MUST answer. Nothing answers on your behalf, because a made-up reply
// would hide a broken device model behind a plausible value. A host that has
// had no answer for 5 s of wall time names the device that did not answer and
// stops, and one that knows the part cannot answer (it has failed) stops at
// once.
//
// The answer reaches the guest once the bus would have finished clocking the
// transaction at the speed the firmware programmed, and the guest runs through
// that wait as it would on hardware. Nothing is added to any clock.
message BusRequest {
  // Quote this back in the reply. It names this request and no other: no two
  // requests in a run share one, so a second answer to a request, or one to a
  // request from before a chip reset, matches nothing and is refused.
  uint64 correlation_id = 1;
  oneof op {
    I2cTransaction i2c = 2;
    SpiTransfer spi = 3;
  }
}

// The answer to a BusRequest, sent on ROUTER. Only the consumer the request
// went to may answer it; a reply from any other is refused.
message BusReply {
  uint64 correlation_id = 1;
  // False: no device answered. On I2C a NACK, which the IDF driver reports as
  // ESP_ERR_NOT_FOUND from i2c_master_probe and as a failed transfer
  // otherwise. On SPI, where nothing acknowledges, a MISO nobody drives: the
  // read gets 0xFF. An I2C device that is there and has nothing to send ACKs
  // with no data; an SPI read is answered with its rx_len bytes.
  bool ack = 2;
  // The bytes read: read_len (I2C) or rx_len (SPI) of them, in the order they
  // were clocked. Fewer are padded with 0xFF, what a master reads from a line
  // nobody drives; more are dropped. Either is logged. Ignored for a
  // write-only I2C transaction.
  bytes data = 3;
  // Which kind of transaction this answers: echo the BusRequest's op, so
  // BUS_OP_I2C for an I2C transaction and BUS_OP_SPI for an SPI transfer. It
  // picks the bus the reply is offered
  // to, and that bus then checks a request of its own is out under
  // correlation_id, so a reply to a question nobody asked is refused rather
  // than raising an interrupt out of nowhere. A reply without it is refused.
  BusOp op = 4;
}

// Companion to BusReply.op.
enum BusOp {
  BUS_OP_UNSPECIFIED = 0;
  BUS_OP_I2C = 1;
  BUS_OP_SPI = 2;
}

// One logical I2C transaction. See BusRequest.
//
// The controller's FIFO holds 32 bytes, so a driver sends a transaction that
// does not fit as several command lists, each ending where it refills the
// FIFO. The pieces of a write are joined: `write` is every byte the master
// clocked out, so a register read is one transaction, the register in
// `write` and the length in `read_len`.
//
// A read split that way arrives as several requests, because the device
// answers each piece before the master asks for the next. The first carries
// the write bytes and the first piece; each later one has `continues` set, no
// write bytes, and the next piece, and the device answers from where its read
// left off, as it does on the wire: no START or address reached it in
// between. esp_driver_i2c splits a read of 32 bytes or more; the legacy
// driver (driver/i2c.h) splits every READ, so its 6-byte read with the last
// byte NACKed arrives as 5 bytes and then 1. A NACK of a continuing piece
// reads as an undriven line, 0xFF: a device cannot NACK the master's read.
//
// A transaction with no write bytes and no read is a probe
// (i2c_master_probe): ACK it if the device is there.
message I2cTransaction {
  uint32 bus = 1;        // IDF i2c_port_t: 0, or 1 where the chip has two
  uint32 addr = 2;       // 7-bit address, unshifted
  bytes write = 3;       // bytes the master clocked out
  uint32 read_len = 4;   // bytes the master expects back; 0 = write-only
  bool continues = 5;    // the next piece of the read before it; see above
}

// One SPI transfer, as the master clocked it. See BusRequest.
//
// cs_slot is decoded from the peripheral's MISC register, where the selected
// line is the one CS*_DIS bit still clear. A request only goes to the part
// whose chip-select pad resolves to (bus, cs_slot), so a part that claims one
// chip select needs neither field to know the transfer is its own.
message SpiTransfer {
  uint32 bus = 1;        // GPSPI instance: 2 or 3 (SPI2_HOST, SPI3_HOST)
  uint32 cs_slot = 2;    // the chip-select line, 0..5; not a pad number
  // The data phase the master clocked out, a DMA write's bytes as well as a
  // CPU one's. Empty for a transfer with no write phase. A full-duplex read
  // clocks one anyway: it carries what the controller's buffer held, or
  // nothing after a DMA write on the bus.
  bytes tx = 3;
  // Bytes the master reads back, into its W registers or through DMA alike.
  // 0 = a write: it completed already, and nothing waits for an answer.
  uint32 rx_len = 4;

  // Every pin's level AT THE MOMENT THIS TRANSFER WAS CLOCKED. Bit N = GPIO N,
  // the same encoding as RegisterAck.pin_levels.
  //
  // Needed because some devices carry a transfer's MEANING on a pin rather
  // than on the wire. An ST7789 has no address and no control byte: D/C low is
  // a command, D/C high is pixel data, and the driver toggles it microseconds
  // before each transfer. A part following the GpioLevel stream sees the level
  // as of the end of the emulator's pass, which for a display is "data" every
  // time; this is the level as the transfer was clocked.
  uint64 pin_levels = 5;

  // ---- Framing and line widths. A part that ignores all of it still gets
  // the data phase in `tx`. ----
  //
  // A half-duplex transfer is CMD + [ADDR] + [DUMMY] + [DATA], each phase on
  // 1, 2, 4 or 8 lines (ESP32-C3 TRM section 27.5.8.4). IDF uses the command and address
  // phases when a device is added with `command_bits` / `address_bits`, and
  // multi-line phases for SPI_TRANS_MODE_DIO/QIO/OCT and
  // SPI_TRANS_MULTILINE_CMD/ADDR. The wire order is cmd, addr, dummy, tx.
  //
  // `esp_lcd` QSPI panels (ST77916, CO5300, SH8601) use NEITHER phase: the
  // 32-bit opcode word (0x02 / 0x32, 0x00, lcd_cmd, 0x00) is sent as a
  // one-line DATA transfer with cs_keep_active set, and the pixels follow as
  // a separate DATA transfer on four lines. A panel part therefore sees the
  // opcode at the start of `tx`, and joins the two transfers by
  // cs_keep_active.

  // The command phase, if the transfer has one.
  SpiPhase cmd = 6;
  // The address phase, if the transfer has one.
  SpiPhase addr = 7;
  // SCK cycles between address and data; nothing is driven. 0 = none.
  uint32 dummy_cycles = 8;
  // Lines the data-out phase (`tx`) and the data-in phase (the reply) are
  // clocked on: 1, 2, 4 or 8. Bytes are bytes whatever the width -- a part
  // never de-interleaves lines to get them; see line_pins for which pad
  // carried which line.
  uint32 tx_lines = 9;
  uint32 rx_lines = 10;
  // Command, address and `tx` bytes leave LSB first (SPI_DEVICE_TXBIT_LSBFIRST).
  // Default false: MSB first, bit 7 of each byte on the wire first.
  bool lsb_first = 11;
  // Chip select stays asserted after this transfer, so the next transfer on
  // the same device continues the same device-level frame
  // (SPI_TRANS_CS_KEEP_ACTIVE). A QSPI panel's opcode word and its pixels are
  // two transfers joined this way.
  bool cs_keep_active = 12;
  // The pad (GPIO number) carrying each data line SIO0.. of the widest phase
  // in this transfer: SIO0 = D/MOSI, SIO1 = Q/MISO, SIO2 = WP, SIO3 = HD,
  // SIO4..7 = IO4..7. 0xFFFFFFFF = that line reaches no pad. As long as the
  // widest phase needs, and never shorter than two: a 1-line transfer lists
  // SIO0 and SIO1. On each SCK cycle of an N-line phase, MSB first, the first
  // of the next N bits goes on the highest line (4-bit: HD=B7, WP=B6, Q=B5,
  // D=B4, then B3..B0) -- TRM Table 27.5-5; LSB first reverses the order
  // within the byte.
  repeated uint32 line_pins = 13;
  // 3-wire half-duplex (SPI_DEVICE_3WIRE): a one-line phase uses SIO0 (D) in
  // both directions, so the reply to a one-line read comes in on D, not Q.
  bool three_wire = 14;
}

// One command or address phase, as the master clocked it.
message SpiPhase {
  // Length in bits: 1..16 for a command, 1..32 for an address.
  uint32 bits = 1;
  // Lines: 1, 2, 4 or 8.
  uint32 lines = 2;
  // The bits in wire order, packed like `tx`: bytes in the order sent, each
  // MSB first unless lsb_first. A partial last byte sends its first
  // bits % 8 bits in that order (the high bits when MSB first).
  bytes data = 3;
}
